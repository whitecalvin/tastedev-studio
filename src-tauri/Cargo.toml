[package]
name = "tastedev-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "studio_runtime"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "=0.9.0"
sha2 = "0.10.9"
base64 = "=0.22.1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
log = "=0.4.34"
tastedev-update = { path = "../crates/tastedev-update" }
reqwest = { version = "=0.13.5", features = ["blocking"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
[features]
custom-protocol = ["tauri/custom-protocol"]
